<!-- ============================================================
     Pomp & Circumstance — Site Settings → Custom Code → FOOTER
     Version-controlled source of truth for the before-</body> block.

     Changes vs the previous footer:

     deferred, so they are ready first.

     scripts). It is a second copy of the colon-break logic that already

     Remember to bump @1.0.0 when you tag a new release.
     ============================================================ -->

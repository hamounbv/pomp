<!-- ============================================================
     Pomp & Circumstance — Site Settings → Custom Code → HEAD
     Version-controlled source of truth for the head block. Paste its
     contents into Webflow Site Settings, replacing everything currently
     between the Start/End markers.

     Changes vs the previous head:
     - duplicate viewport meta (maximum-scale=1) removed — it disabled
       pinch-zoom (accessibility fail, flagged by Lighthouse); prevent iOS
       input zoom with input font-size >= 16px instead
     - Ahrefs Analytics added
     - site CSS now loads from the pinned jsDelivr build; the whole
       `G | Embed Code` component that carried the inline copy gets deleted
     - `.pre-loader { display: flex }` removed — verified against 10 pages,
       no element on the site carries that class, so the rule was dead
     - global JSON-LD added (the site had zero structured data on all 71 pages)
     - canonical is NOT set here: it must be per-page, see the fix kit
     Remember to bump @1.0.0 when you tag a new release.
     ============================================================ -->
